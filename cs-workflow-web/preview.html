    const orderedKeys = ["intake", "gameteam", "botrules", "accounts", "numbers", "wrap"];

    const switcher = document.getElementById("switcher");
    const moduleEl = document.getElementById("module");
    const descEl = document.getElementById("desc");
    const hintEl = document.getElementById("hint");
    const inputEl = document.getElementById("input");
    const charCountEl = document.getElementById("charCount");
    const tokensEl = document.getElementById("tokens");
    const outputEl = document.getElementById("output");

    orderedKeys.forEach((k) => {
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = MODULES[k].label;
      moduleEl.appendChild(opt);

      const btn = document.createElement("button");
      btn.textContent = MODULES[k].label.split(" (")[0];
      btn.dataset.key = k;
      btn.onclick = () => switchTo(k);
      switcher.appendChild(btn);
    });

    function switchTo(key) {
      const m = MODULES[key];
      const d = DEMOS[key];
      descEl.textContent = m.desc;
      hintEl.textContent = m.hint;
      moduleEl.value = key;
      inputEl.value = d.input;
      charCountEl.textContent = `${d.input.length.toLocaleString()} 字符`;
      tokensEl.textContent = d.tokens;
      outputEl.innerHTML = d.output;
      [...switcher.children].forEach((b) => {
        b.classList.toggle("active", b.dataset.key === key);
      });
    }

    moduleEl.addEventListener("change", (e) => switchTo(e.target.value));

    // start on intake
    switchTo("intake");
  </script>
